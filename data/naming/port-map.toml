# port-map registry v0（phase0 交付物③——G3 清偿，r19）
#
# 语义：asm 子程序 → Rust 归宿的**双射登记**（bank:addr → crate::module::fn）。
# 【范围声明（D7）】v0=帧管线核+声引擎分派核+本会话已验端口件；**增量补齐随域改写
# 六步流程**（每簇 port 时追加）——S 面分母×registry 双射在 v1 达成前不可机械证，
# 残余风险已由 asm-rust-module-mapping.md §4 头声明承担。
# 校验：python tools/port_coverage.py（rust 归宿存在性+双射性）

